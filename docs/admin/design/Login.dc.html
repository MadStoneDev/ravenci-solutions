<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>Sign in — RAVENCI Admin</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f7f6f3}
a{color:#8e1a81}a:hover{color:#6d1263}
</style>
</helmet>
<div style="min-height: 900px; display: flex; flex-wrap: wrap; background: #f7f6f3; color: #0e0e11; font-family: Archivo, 'Helvetica Neue', Arial, sans-serif;">

  <section aria-hidden="true" style="flex: 1 1 420px; box-sizing: border-box; padding: 48px; background: #0e0e11; color: #f7f6f3; display: flex; flex-direction: column; justify-content: space-between; gap: 48px;">
    <span style="font-size: 17px; font-weight: 700; letter-spacing: 0.1em;">RAVENCI</span>
    <div style="display: flex; flex-direction: column; gap: 16px; max-width: 460px;">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #d58ccb;">Writing desk</span>
      <p style="margin: 0; font-size: 34px; line-height: 1.12; letter-spacing: -0.025em; font-weight: 700;">Plain notes on web development, SEO, and running a site that lasts.</p>
    </div>
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #a3a3ac;">Built once. Built properly.</span>
  </section>

  <main style="flex: 1 1 420px; box-sizing: border-box; padding: 48px 32px; display: flex; align-items: center; justify-content: center;">
    <div style="width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 24px;">
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <h1 style="margin: 0; font-size: 34px; line-height: 1.12; letter-spacing: -0.025em; font-weight: 700;">Sign in</h1>
        <p style="margin: 0; font-size: 15px; line-height: 1.55; color: #5a5a63;">Owner access only.</p>
      </div>

      <form style="display: flex; flex-direction: column; gap: 14px;">
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500;">Email
          <input type="email" autocomplete="email" placeholder="you@ravenci.solutions" style="height: 44px; padding: 0 12px; border: 1px solid #e0ddd6; border-radius: 3px; background: #ffffff; font: inherit; font-size: 15px; color: #0e0e11;">
        </label>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500;">Password
          <input type="password" autocomplete="current-password" style="height: 44px; padding: 0 12px; border: 1px solid #e0ddd6; border-radius: 3px; background: #ffffff; font: inherit; font-size: 15px; color: #0e0e11;">
        </label>
        <button type="submit" style="height: 48px; border: 0; border-radius: 3px; background: #0e0e11; color: #f7f6f3; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer;">Sign in</button>
      </form>

      <button style="align-self: flex-start; height: 44px; padding: 0; border: 0; background: transparent; font: inherit; font-size: 14px; font-weight: 600; color: #8e1a81; cursor: pointer;">Email me a one-time code instead</button>

      <p style="margin: 0; font-size: 13px; line-height: 1.55; color: #5a5a63;"><a href="https://ravenci.solutions">Back to ravenci.solutions</a></p>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
